<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voice Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2/dist/livekit-client.umd.min.js"></script>
<style>
  :root {
    --bg1: #05060a;
    --bg2: #171227;
    --violet: #7c6cf6;
    --violet-2: #a78bfa;
    --pink: #f472b6;
    --muted: #8a90a6;
    --text: #f2f2f8;
    --panel: rgba(255,255,255,0.04);
    --border: rgba(255,255,255,0.09);
    --danger: #ef4444;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    background:
      radial-gradient(circle at 20% 0%, rgba(124,108,246,0.20) 0%, transparent 45%),
      radial-gradient(circle at 80% 10%, rgba(244,114,182,0.14) 0%, transparent 40%),
      radial-gradient(circle at 50% 100%, var(--bg2) 0%, var(--bg1) 70%);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100%;
    padding: 40px 20px 28px;
    overflow-x: hidden;
  }
  .headline {
    text-align: center;
    max-width: 380px;
    margin-bottom: 30px;
  }
  .headline h1 {
    font-size: 22px;
    font-weight: 800;
    line-height: 1.3;
    margin: 0 0 8px;
  }
  .headline h1 span { color: var(--violet-2); }
  .headline p {
    margin: 0;
    font-size: 13px;
    color: var(--muted);
  }
  .stage {
    position: relative;
    width: 220px;
    height: 220px;
    display: grid;
    place-items: center;
  }
  .wave {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 260px;
    height: 60px;
    top: 50%;
    transform: translateY(-50%);
    opacity: 0;
    transition: opacity 0.3s ease;
    pointer-events: none;
  }
  body[data-state="listening"] .wave,
  body[data-state="speaking"] .wave { opacity: 0.6; }
  .wave svg { width: 100%; height: 100%; }
  #mic {
    position: relative;
    z-index: 2;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    border: 0;
    cursor: pointer;
    background: linear-gradient(160deg, var(--violet-2), var(--violet));
    color: #fff;
    display: grid;
    place-items: center;
    box-shadow: 0 16px 40px rgba(124, 108, 246, 0.4), inset 0 0 0 1px rgba(255,255,255,0.18);
    transition: transform 0.15s ease, background 0.35s ease, box-shadow 0.35s ease;
  }
  #mic:hover { transform: scale(1.03); }
  #mic:active { transform: scale(0.96); }
  #mic svg.icon-mic { width: 40px; height: 40px; }
  body[data-state="speaking"] #mic,
  body[data-state="listening"] #mic { background: linear-gradient(160deg, var(--violet-2), var(--pink)); }
  body[data-state="connecting"] #mic { background: #3a3f55; box-shadow: none; }
  body[data-state="connecting"] .icon-mic { animation: spin 1.1s linear infinite; }
  body[data-state="error"] #mic { background: linear-gradient(160deg, #f87171, #dc2626); }
  .bars { display: none; align-items: center; gap: 4px; height: 40px; }
  body[data-state="listening"] .bars,
  body[data-state="speaking"] .bars { display: flex; }
  body[data-state="listening"] .icon-mic,
  body[data-state="speaking"] .icon-mic { display: none; }
  .bars i {
    width: 4px;
    border-radius: 3px;
    background: #fff;
    animation: bar 1.1s ease-in-out infinite;
  }
  .bars i:nth-child(1) { height: 14px; animation-delay: 0s; }
  .bars i:nth-child(2) { height: 26px; animation-delay: 0.12s; }
  .bars i:nth-child(3) { height: 38px; animation-delay: 0.24s; }
  .bars i:nth-child(4) { height: 26px; animation-delay: 0.36s; }
  .bars i:nth-child(5) { height: 14px; animation-delay: 0.48s; }
  body[data-state="speaking"] .bars i { animation-duration: 0.6s; }
  @keyframes bar {
    0%, 100% { transform: scaleY(0.4); }
    50%      { transform: scaleY(1); }
  }
  .ring {
    position: absolute;
    inset: 0;
    margin: auto;
    width: 132px;
    height: 132px;
    border-radius: 50%;
    border: 1.5px solid var(--violet-2);
    opacity: 0;
    z-index: 1;
  }
  body[data-state="listening"] .ring { animation: pulse 2.6s ease-out infinite; }
  body[data-state="listening"] .r2 { animation-delay: 1.3s; }
  body[data-state="speaking"] .ring { border-color: var(--pink); animation: pulse 1.1s ease-out infinite; }
  body[data-state="speaking"] .r2 { animation-delay: 0.55s; }
  @keyframes pulse {
    0%   { transform: scale(1);   opacity: 0.5; }
    100% { transform: scale(1.7); opacity: 0; }
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .agent-name { margin-top: 16px; font-size: 17px; font-weight: 700; }
  .agent-sub { margin-top: 2px; font-size: 12px; color: var(--muted); }

  .dots { display: flex; gap: 4px; margin-top: 8px; }
  .dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); opacity: 0.5; }
  body[data-state="listening"] .dots span,
  body[data-state="speaking"] .dots span { animation: dotpulse 1.2s ease-in-out infinite; opacity: 1; background: var(--violet-2); }
  .dots span:nth-child(2) { animation-delay: 0.2s; }
  .dots span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes dotpulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.6); } }

  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0,0,0,0); }

  #caption {
    margin-top: 18px;
    width: min(340px, 82vw);
    height: 42px;
    line-height: 42px;
    text-align: center;
    font-size: 14px;
    font-style: italic;
    color: var(--text);
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 21px;
    padding: 0 18px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  #caption::before { content: '\201C'; font-style: normal; color: var(--muted); }
  #caption::after { content: '\201D'; font-style: normal; color: var(--muted); }

  #controls {
    display: flex;
    align-items: flex-end;
    gap: 14px;
    margin-top: 30px;
  }
  .ctrl-btn {
    width: 50px;
    height: 50px;
    border-radius: 50%;
    border: 1px solid var(--border);
    background: rgba(255,255,255,0.05);
    color: var(--text);
    display: grid;
    place-items: center;
    cursor: pointer;
    transition: background 0.2s ease, transform 0.15s ease;
  }
  .ctrl-btn:hover { background: rgba(255,255,255,0.1); }
  .ctrl-btn:active { transform: scale(0.94); }
  .ctrl-btn svg { width: 19px; height: 19px; }
  .ctrl-btn.muted { color: var(--danger); border-color: rgba(239,68,68,0.4); }
  .ctrl-btn.off { opacity: 0.4; }
  #endBtn {
    width: 64px;
    height: 64px;
    background: linear-gradient(160deg, #fb7185, var(--danger));
    border-color: transparent;
    box-shadow: 0 10px 28px rgba(239,68,68,0.4);
  }
  #endBtn svg { width: 24px; height: 24px; }
  #endBtn:hover { background: linear-gradient(160deg, #f87171, #dc2626); }
  .ctrl-label { font-size: 10px; color: var(--muted); text-align: center; margin-top: 6px; }
  .ctrl { display: flex; flex-direction: column; align-items: center; }

  #transcriptPanel {
    width: min(560px, 100%);
    margin-top: 24px;
    max-height: 30vh;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding: 16px;
    border-radius: 18px;
    background: var(--panel);
    border: 1px solid var(--border);
  }
  .row { display: flex; }
  .row.you { justify-content: flex-end; }
  .row.agent { justify-content: flex-start; }
  .bubble {
    max-width: 78%;
    padding: 10px 15px;
    border-radius: 16px;
    font-size: 14px;
    line-height: 1.4;
  }
  .row.you .bubble { background: linear-gradient(160deg, var(--violet-2), var(--violet)); color: #fff; border-bottom-right-radius: 5px; }
  .row.agent .bubble { background: #1c2136; border: 1px solid var(--border); border-bottom-left-radius: 5px; }

  [hidden] { display: none !important; }
</style>
</head>
<body data-state="idle">
  <div class="headline">
    <h1>Your AI voice agent is <span>ready to talk</span></h1>
    <p>Natural voices. Real conversations.</p>
  </div>

  <div class="stage">
    <span class="ring r1"></span>
    <span class="ring r2"></span>
    <div class="wave">
      <svg viewBox="0 0 260 60" preserveAspectRatio="none">
        <path d="M0,30 Q30,5 60,30 T120,30 T180,30 T260,30" fill="none" stroke="url(#g1)" stroke-width="2"/>
        <defs>
          <linearGradient id="g1" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0%" stop-color="#7c6cf6" stop-opacity="0"/>
            <stop offset="50%" stop-color="#a78bfa" stop-opacity="0.8"/>
            <stop offset="100%" stop-color="#f472b6" stop-opacity="0"/>
          </linearGradient>
        </defs>
      </svg>
    </div>
    <button id="mic" aria-label="Start or end call">
      <svg class="icon-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="9" y="2" width="6" height="12" rx="3"></rect>
        <path d="M5 11a7 7 0 0 0 14 0"></path>
        <line x1="12" y1="18" x2="12" y2="22"></line>
      </svg>
      <div class="bars"><i></i><i></i><i></i><i></i><i></i></div>
    </button>
  </div>

  <p class="agent-name">Voice Agent</p>
  <p class="agent-sub" id="status">Ready</p>
  <div class="dots"><span></span><span></span><span></span></div>

  <div id="caption" hidden></div>

  <div id="controls" hidden>
    <div class="ctrl">
      <button class="ctrl-btn" id="muteBtn" aria-label="Mute">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="6" height="12" rx="3"></rect>
          <path d="M5 11a7 7 0 0 0 14 0"></path>
          <line x1="12" y1="18" x2="12" y2="22"></line>
        </svg>
      </button>
      <span class="ctrl-label">Mute</span>
    </div>
    <div class="ctrl">
      <button class="ctrl-btn" id="transcriptBtn" aria-label="Transcript">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
        </svg>
      </button>
      <span class="ctrl-label">Transcript</span>
    </div>
    <div class="ctrl">
      <button class="ctrl-btn" id="endBtn" aria-label="End call">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 20.94l-2.53-1.46a2 2 0 0 0-2.11.12l-2.1 1.51a2 2 0 0 1-2.11.16 15.9 15.9 0 0 1-6.32-6.32 2 2 0 0 1 .16-2.11l1.51-2.1a2 2 0 0 0 .12-2.11L8.06 6"></path>
          <line x1="1" y1="1" x2="23" y2="23"></line>
        </svg>
      </button>
      <span class="ctrl-label">End call</span>
    </div>
    <div class="ctrl">
      <button class="ctrl-btn" id="speakerBtn" aria-label="Speaker">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
      <span class="ctrl-label">Speaker</span>
    </div>
    <div class="ctrl">
      <button class="ctrl-btn" id="restartBtn" aria-label="Restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="1 4 1 10 7 10"></polyline>
          <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
        </svg>
      </button>
      <span class="ctrl-label">Restart</span>
    </div>
  </div>

  <div id="transcriptPanel" hidden></div>

<script>
  const mic = document.getElementById("mic");
  const statusEl = document.getElementById("status");
  const captionEl = document.getElementById("caption");
  const controls = document.getElementById("controls");
  const muteBtn = document.getElementById("muteBtn");
  const speakerBtn = document.getElementById("speakerBtn");
  const endBtn = document.getElementById("endBtn");
  const transcriptBtn = document.getElementById("transcriptBtn");
  const restartBtn = document.getElementById("restartBtn");
  const transcriptPanel = document.getElementById("transcriptPanel");

  let room = null;
  let muted = false;
  let speakerOn = true;
  let lastEntry = null; // { who, bubble, row, time }

  function setState(state, text) {
    document.body.dataset.state = state;
    statusEl.textContent = text;
  }

  let pendingCaption = null;
  let captionScheduled = false;
  function setCaption(text) {
    pendingCaption = text;
    captionEl.hidden = false;
    if (captionScheduled) return;
    captionScheduled = true;
    requestAnimationFrame(() => {
      captionEl.textContent = pendingCaption;
      captionScheduled = false;
    });
  }

  function createBubble(who) {
    const row = document.createElement("div");
    row.className = "row " + who;
    const bubble = document.createElement("div");
    bubble.className = "bubble";
    row.appendChild(bubble);
    transcriptPanel.appendChild(row);
    transcriptPanel.scrollTop = transcriptPanel.scrollHeight;
    return { row, bubble };
  }

  function applyTranscript(who, text) {
    text = text.trim();
    if (!text) return;

    const prev = lastEntry && lastEntry.bubble.textContent;
    const sameSpeaker = lastEntry && lastEntry.who === who;
    const recent = lastEntry && (Date.now() - lastEntry.time < 4000);
    const relatedText = prev && (text.startsWith(prev) || prev.startsWith(text));

    if (sameSpeaker && recent && relatedText) {
      lastEntry.bubble.textContent = text;
      lastEntry.time = Date.now();
    } else {
      const { row, bubble } = createBubble(who);
      bubble.textContent = text;
      lastEntry = { who, bubble, row, time: Date.now() };
    }

    setCaption(text);
    transcriptPanel.scrollTop = transcriptPanel.scrollHeight;
  }

  function cleanup() {
    document.querySelectorAll("audio[data-lk]").forEach((a) => a.remove());
    controls.hidden = true;
    lastEntry = null;
    room = null;
    if (document.body.dataset.state !== "error") setState("idle", "Ready");
  }

  async function start() {
    try {
      setState("connecting", "Connecting...");
      console.log("[UI] mic clicked");

      if (!window.LivekitClient) {
        throw new Error("livekit-client load nahi hua (internet check karo)");
      }

      const res = await fetch("/api/token");
      if (!res.ok) {
        throw new Error("Token server error " + res.status + ": " + (await res.text()));
      }
      const { url, token } = await res.json();
      console.log("[UI] token fetched");

      room = new LivekitClient.Room();
      const RE = LivekitClient.RoomEvent;

      room.on(RE.TrackSubscribed, (track) => {
        if (track.kind === "audio") {
          const el = track.attach();
          el.dataset.lk = "1";
          el.volume = speakerOn ? 1 : 0;
          document.body.appendChild(el);
          console.log("[UI] agent audio attached");
        }
      });

      room.on(RE.ActiveSpeakersChanged, (speakers) => {
        if (!room) return;
        const agentTalking = speakers.some((s) => s !== room.localParticipant);
        if (agentTalking) setState("speaking", "Agent speaking");
        else setState("listening", "Listening");
      });

      room.on(RE.Disconnected, cleanup);

      try {
        room.registerTextStreamHandler("lk.transcription", async (reader, info) => {
          const mine = info.identity === room.localParticipant.identity;
          const who = mine ? "you" : "agent";
          let text = "";
          try {
            text = await reader.readAll();
          } catch (_) {
            for await (const chunk of reader) {
              text = typeof chunk === "string" ? chunk : (reader.text || text);
            }
          }
          applyTranscript(who, text || "");
        });
      } catch (e) {
        console.warn("[UI] transcript handler failed:", e);
      }

      await room.connect(url, token);
      console.log("[UI] room connected");
      await room.startAudio();
      await room.localParticipant.setMicrophoneEnabled(true);
      console.log("[UI] mic enabled");

      muted = false;
      muteBtn.classList.remove("muted");
      controls.hidden = false;
      setState("listening", "Listening");
    } catch (err) {
      console.error("[UI] error:", err);
      const r = room;
      room = null;
      if (r) {
        try { await r.disconnect(); } catch (_) {}
      }
      setState("error", "Error: " + (err && err.message ? err.message : err));
      setCaption("Error: " + (err && err.message ? err.message : err));
    }
  }

  async function stop() {
    if (room) await room.disconnect();
  }

  mic.addEventListener("click", () => {
    if (room) stop();
    else start();
  });

  endBtn.addEventListener("click", stop);

  muteBtn.addEventListener("click", async () => {
    if (!room) return;
    muted = !muted;
    await room.localParticipant.setMicrophoneEnabled(!muted);
    muteBtn.classList.toggle("muted", muted);
  });

  speakerBtn.addEventListener("click", () => {
    speakerOn = !speakerOn;
    speakerBtn.classList.toggle("off", !speakerOn);
    document.querySelectorAll("audio[data-lk]").forEach((a) => { a.volume = speakerOn ? 1 : 0; });
  });

  transcriptBtn.addEventListener("click", () => {
    transcriptPanel.hidden = !transcriptPanel.hidden;
  });

  restartBtn.addEventListener("click", async () => {
    await stop();
    setTimeout(start, 400);
  });
</script>
</body>
</html>
